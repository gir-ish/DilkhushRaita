<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DilKhush Dhaba">
  <!--
    Maskable variant. Android crops this to whatever shape the launcher uses —
    circle, squircle, teardrop — so the art is drawn inside the safe zone (the
    centre 80%, i.e. a circle of radius 205 about the middle) and the maroon
    runs edge to edge with no rounded corners of its own. Anything outside that
    circle must be background only, or a round launcher will slice it off.
  -->
  <rect width="512" height="512" fill="#71201C"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <g fill="none" stroke="#DFC57C" stroke-width="18" stroke-linecap="round">
      <path d="M196 206c-22-26 22-42 0-68"/>
      <path d="M256 196c-22-26 22-42 0-68"/>
      <path d="M316 206c-22-26 22-42 0-68"/>
    </g>
    <rect x="104" y="252" width="304" height="34" rx="17" fill="#DFC57C"/>
    <path d="M132 286h248a124 124 0 0 1-248 0z" fill="#FAF3E3"/>
  </g>
</svg>
