<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DilKhush Dhaba">
  <!--
    PLACEHOLDER brand mark — a katori of raita, which is what the shop is known
    for. Replace with the real logo when there is one, then re-run
    `node scripts/make-icons.mjs` to rebuild every PNG size from this file.

    Deliberately pure vector: no emoji and no font text. An emoji renders in
    whatever the rasteriser happens to have (ours came out as a flat monochrome
    blob), and "DilKhush" set at this size is unreadable once Android squeezes
    the icon into a 48px launcher tile. Shapes survive both.
  -->
  <rect width="512" height="512" rx="112" fill="#71201C"/>
  <g fill="none" stroke="#DFC57C" stroke-width="18" stroke-linecap="round">
    <path d="M196 206c-22-26 22-42 0-68"/>
    <path d="M256 196c-22-26 22-42 0-68"/>
    <path d="M316 206c-22-26 22-42 0-68"/>
  </g>
  <rect x="104" y="252" width="304" height="34" rx="17" fill="#DFC57C"/>
  <path d="M132 286h248a124 124 0 0 1-248 0z" fill="#FAF3E3"/>
</svg>
