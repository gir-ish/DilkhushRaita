name: Build the Android app

# Builds the owner's phone app and attaches the APK to the run, so the file
# can be downloaded straight onto a phone. Nothing is published anywhere:
# this app is handed out by its owner, not listed in a store.
#
# To get the file: GitHub → Actions → this workflow → the newest run →
# Artifacts → dilkhush-dashboard-apk.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  # …and on demand, which is how you get a fresh build without changing code.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android action. It is built for Node 20, GitHub now forces
      # actions onto Node 24, and it dies on contact — which is what killed
      # the first two builds. The runner image already carries an Android SDK,
      # so the only real question is whether it carries the pieces this build
      # needs, and that can be asked directly.
      - name: Make sure the Android SDK has what this build needs
        run: |
          set -eux
          : "${ANDROID_HOME:=$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Licences are accepted non-interactively; `yes` closes a pipe the
          # tool is still writing to, so its exit code says nothing useful.
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          # No-ops when the image already has them, which it usually does.
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Gradle ships on the runner image, but which version is not ours to
      # decide and this build needs 8.5 or newer for the Android plugin. Used
      # if it is new enough, downloaded if it is not, so the build does not
      # depend on what today's image happens to carry.
      - name: Make sure Gradle is new enough
        run: |
          set -eux
          want=8.11.1
          have=$(gradle --version 2>/dev/null | awk '/^Gradle /{print $2}' || true)
          echo "runner has Gradle: ${have:-none}"
          if [ "$have" = "$want" ]; then
            echo "GRADLE=gradle" >> "$GITHUB_ENV"
          else
            curl -sSLo /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-$want-bin.zip"
            unzip -q /tmp/gradle.zip -d /opt
            echo "GRADLE=/opt/gradle-$want/bin/gradle" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: mobile
        # --stacktrace so a failure says where, rather than that it failed.
        run: $GRADLE assembleRelease --no-daemon --stacktrace

      - name: Name it something a person can read
        run: |
          set -eux
          mkdir -p out
          cp mobile/app/build/outputs/apk/release/*.apk \
             "out/DilKhush-Dashboard-${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dilkhush-dashboard-apk
          path: out/*.apk
          # Long enough to still be there when somebody gets round to it.
          retention-days: 60

      # A failed build is the normal case the first few times, and the useful
      # part is the report Gradle leaves behind rather than the console.
      - name: Keep the reports when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            mobile/app/build/reports/**
            mobile/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
